<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f4f4f2;font-family:Segoe UI,Roboto,Arial,sans-serif;color:#222">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#fff;border:1px solid #c9c9c6;border-radius:8px">
    <tr><td style="padding:24px">
      <p style="margin:0 0 4px;font-weight:700;font-size:16px">iBanking</p>
      <p style="margin:0 0 4px;font-size:19px;font-weight:700">Payment successful</p>
      <p style="margin:0 0 16px;color:#8a8a8a;font-size:13px">Hello {{ payer_name }}, keep this email as your receipt.</p>
      <table role="presentation" style="width:100%;font-size:14px;border:1px solid #e3e3e0;border-radius:6px;padding:10px">
        <tr><td style="color:#8a8a8a">Transaction ID</td><td style="text-align:right;font:12px Consolas,monospace">{{ txn_id }}</td></tr>
        <tr><td style="color:#8a8a8a">Student</td><td style="text-align:right">{{ mssv }} &middot; {{ student_name }}</td></tr>
        <tr><td style="color:#8a8a8a">Term</td><td style="text-align:right">{{ term }}</td></tr>
        <tr><td style="color:#8a8a8a">Amount</td><td style="text-align:right;font-weight:700">{{ amount | vnd }}</td></tr>
        <tr><td style="color:#8a8a8a">New balance</td><td style="text-align:right">{{ balance_after | vnd }}</td></tr>
        <tr><td style="color:#8a8a8a">Completed</td><td style="text-align:right">{{ completed_at }}</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
