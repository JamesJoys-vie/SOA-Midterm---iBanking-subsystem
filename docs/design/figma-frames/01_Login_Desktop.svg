<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="cardHolo" x1="0" y1="0" x2="440" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="35%" stop-color="#1E3A8A"/>
      <stop offset="70%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="primaryBeam" x1="0" y1="0" x2="384" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="proShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <filter id="holoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#1E40AF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Clean Precision Canvas Background -->
  <rect width="1440" height="900" fill="url(#bgLight)"/>

  <!-- High-Tech Matrix Grid -->
  <g opacity="0.3" stroke="#CBD5E1" stroke-width="1">
    <line x1="0" y1="120" x2="1440" y2="120"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
    <line x1="0" y1="660" x2="1440" y2="660"/>
    <line x1="0" y1="840" x2="1440" y2="840"/>
    <line x1="240" y1="0" x2="240" y2="900"/>
    <line x1="480" y1="0" x2="480" y2="900"/>
    <line x1="720" y1="0" x2="720" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>

  <!-- System Telemetry Top Header Bar -->
  <g transform="translate(100, 36)">
    <rect width="1240" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Status Dot -->
    <circle cx="20" cy="17" r="4" fill="#10B981"/>
    <text x="32" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#047857">SYSTEM OPERATIONAL · NODE AP-SOUTHEAST-1</text>
    
    <text x="560" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748B">LATENCY: 12ms</text>
    <text x="700" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748B">PROTOCOL: SOA/TLS 1.3</text>
    <text x="880" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748B">SESSION ID: #SEC-9820-AF</text>
    <text x="1110" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#2563EB">256-BIT AES-GCM</text>
  </g>

  <!-- LEFT HERO SECTION (Impactful Enterprise Identity) -->
  <g id="Left_Hero" transform="translate(100, 95)">
    <!-- Corner Reticles for High-Tech Vibe -->
    <text x="-15" y="-5" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#94A3B8">+</text>
    
    <!-- Brand Title -->
    <g id="Brand_Header">
      <rect width="48" height="48" rx="14" fill="#0F172A"/>
      <path d="M24 12V36M12 24H36" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
      <text x="18" y="33" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF">i</text>
      
      <text x="62" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#0F172A" letter-spacing="-0.5">iBanking</text>
      <rect x="195" y="12" width="135" height="26" rx="6" fill="#0F172A"/>
      <text x="206" y="29" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#38BDF8">TERMINAL v2.4</text>
    </g>

    <!-- Punchy Main Title -->
    <text x="0" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="900" fill="#0F172A" letter-spacing="-1.5">
      <tspan x="0" dy="0">High-Velocity Campus</tspan>
      <tspan x="0" dy="56" fill="#1D4ED8">Tuition Settlement Engine</tspan>
    </text>

    <!-- Subtitle with specs -->
    <text x="0" y="265" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="500" fill="#475569" width="560">
      <tspan x="0" dy="0">Engineered for zero-latency university student billing. Featuring instant</tspan>
      <tspan x="0" dy="26">cryptographic email OTP verification and anti-collision tuition seat holds.</tspan>
    </text>

    <!-- Robust Titanium Virtual Debit Card -->
    <g id="Titanium_Debit_Card" transform="translate(0, 335)" filter="url(#holoShadow)">
      <rect width="450" height="265" rx="22" fill="url(#cardHolo)" stroke="#38BDF8" stroke-width="1.5"/>
      <!-- Diagonal Shimmer Accent -->
      <line x1="300" y1="0" x2="450" y2="150" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
      
      <!-- High-Tech Circuit EMV Chip -->
      <rect x="36" y="34" width="56" height="44" rx="10" fill="#FBBF24" stroke="#B45309" stroke-width="1.2"/>
      <line x1="36" y1="56" x2="92" y2="56" stroke="#92400E" stroke-width="1.2"/>
      <line x1="64" y1="34" x2="64" y2="78" stroke="#92400E" stroke-width="1.2"/>
      <rect x="48" y="46" width="16" height="20" rx="3" fill="#D97706" opacity="0.6"/>

      <!-- Contactless Signal Indicator -->
      <path d="M 116 48 A 12 12 0 0 1 116 64" stroke="#38BDF8" stroke-width="2.5" fill="none"/>
      <path d="M 124 42 A 20 20 0 0 1 124 70" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.7"/>
      <path d="M 132 36 A 28 28 0 0 1 132 76" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.4"/>

      <!-- Security Level Badge -->
      <rect x="310" y="34" width="104" height="26" rx="6" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(56, 189, 248, 0.4)"/>
      <text x="322" y="51" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#38BDF8">TITANIUM 3D</text>

      <!-- Embossed Card Number -->
      <text x="36" y="148" font-family="'JetBrains Mono', monospace" font-size="23" font-weight="800" fill="#FFFFFF" letter-spacing="4">
        4829  ••••  ••••  8892
      </text>

      <!-- Cardholder Specs -->
      <text x="36" y="202" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93C5FD">STUDENT ACCOUNT OWNER</text>
      <text x="36" y="226" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">ALICE NGUYEN</text>

      <text x="240" y="202" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93C5FD">VALID THRU</text>
      <text x="240" y="226" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#FFFFFF">12/30</text>

      <text x="360" y="228" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" font-style="italic" fill="#FFFFFF">VISA</text>
    </g>

    <!-- Telemetry Trust Metrics -->
    <g transform="translate(0, 650)">
      <rect width="180" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#059669">✓ ZERO URL EXPOSURE</text>

      <g transform="translate(195, 0)">
        <rect width="195" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#2563EB">⏱ 5-MIN LOCK VERIFIED</text>
      </g>
    </g>
  </g>

  <!-- RIGHT LOGIN CARD (High-Impact Enterprise Panel) -->
  <g id="Right_Login_Panel" transform="translate(850, 95)" filter="url(#proShadow)">
    <!-- Base Shell -->
    <rect width="490" height="730" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Top Cyber Accent Stripe -->
    <path d="M 0 26 C 0 11.64 11.64 0 26 0 L 464 0 C 478.36 0 490 11.64 490 26 L 490 6 L 0 6 Z" fill="#2563EB"/>
    
    <g transform="translate(48, 50)">
      <!-- Corner Crosshair -->
      <text x="375" y="0" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#94A3B8">+</text>

      <!-- Panel Header -->
      <div class="flex items-center gap-3">
        <rect width="46" height="46" rx="12" fill="#0F172A"/>
        <path d="M23 15C19 15 16 18 16 22V25H30V22C30 18 27 15 23 15Z" fill="#38BDF8"/>
        <rect x="14" y="25" width="18" height="13" rx="3" fill="#60A5FA"/>
      </div>

      <text x="60" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="900" fill="#0F172A">Enterprise Sign In</text>
      <text x="60" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748B">Authenticate into iBanking Core Subsystem</text>

      <!-- Username Field -->
      <g transform="translate(0, 85)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#0F172A">IDENTIFIER // USERNAME</text>
        <rect x="0" y="10" width="394" height="54" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
        <text x="20" y="44" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#0F172A">alice</text>
        
        <rect x="290" y="22" width="90" height="30" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="302" y="42" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#059669">✓ VERIFIED</text>
      </g>

      <!-- Password Field -->
      <g transform="translate(0, 180)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#0F172A">KEY // PASSWORD</text>
        <rect x="0" y="10" width="394" height="54" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
        <text x="20" y="44" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#0F172A">••••••••••••••••</text>
        <text x="340" y="43" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#2563EB">SHOW</text>
      </g>

      <!-- Options -->
      <g transform="translate(0, 275)">
        <rect x="0" y="0" width="20" height="20" rx="5" fill="#2563EB"/>
        <path d="M5 10L9 14L15 6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
        <text x="30" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">Persist credentials for this node</text>
        <text x="260" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563EB">Forgot Key?</text>
      </g>

      <!-- Submit CTA Button -->
      <g transform="translate(0, 325)">
        <rect width="394" height="56" rx="14" fill="url(#primaryBeam)"/>
        <text x="125" y="35" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Access Terminal</text>
        <path d="M260 30L268 35L260 40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Fast Access Demo Chips -->
      <g transform="translate(0, 425)">
        <line x1="0" y1="0" x2="394" y2="0" stroke="#E2E8F0" stroke-width="1"/>
        <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#64748B">FAST PROVISIONING CHIPS:</text>
        
        <g transform="translate(0, 44)">
          <rect width="124" height="42" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
          <circle cx="22" cy="21" r="12" fill="#2563EB"/>
          <text x="18" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#FFFFFF">A</text>
          <text x="44" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#1D4ED8">alice</text>
        </g>
        
        <g transform="translate(135, 44)">
          <rect width="124" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
          <circle cx="22" cy="21" r="12" fill="#64748B"/>
          <text x="18" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#FFFFFF">B</text>
          <text x="44" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#64748B">bob</text>
        </g>

        <g transform="translate(270, 44)">
          <rect width="124" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
          <circle cx="22" cy="21" r="12" fill="#64748B"/>
          <text x="18" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#FFFFFF">C</text>
          <text x="44" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#64748B">carol</text>
        </g>
      </g>

      <!-- Bank Level Notice -->
      <g transform="translate(0, 555)">
        <rect width="394" height="52" rx="12" fill="#0F172A"/>
        <circle cx="28" cy="26" r="12" fill="#1E293B"/>
        <path d="M28 18L33 21V28C33 30 28 33 28 33C28 33 23 30 23 28V21L28 18Z" fill="#38BDF8"/>
        <text x="50" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Bank-Grade Isolation Layer</text>
        <text x="50" y="39" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#94A3B8">Encrypted via SHA-256 / Ephemeral TLS handshakes.</text>
      </g>
    </g>
  </g>
</svg>