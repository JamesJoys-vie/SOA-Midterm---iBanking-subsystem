<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cyberModalShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- High-Tech Backdrop Overlay -->
  <rect width="1440" height="900" fill="#0F172A" fill-opacity="0.6"/>

  <!-- Centered Robust Modal Dialog -->
  <g id="Cyber_OTP_Modal" transform="translate(440, 120)" filter="url(#cyberModalShadow)">
    <rect width="560" height="650" rx="30" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    
    <!-- Top Cyber Stripe -->
    <path d="M 0 30 C 0 13.4 13.4 0 30 0 L 530 0 C 546.6 0 560 13.4 560 30 L 560 8 L 0 8 Z" fill="#2563EB"/>
    
    <!-- Top Security Shield Icon with HUD Ring -->
    <g transform="translate(242, 45)">
      <circle cx="38" cy="38" r="38" fill="#0F172A"/>
      <circle cx="38" cy="38" r="32" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 4"/>
      <path d="M38 22L50 27V38C50 46 38 54 38 54C38 54 26 46 26 38V27L38 22Z" fill="#2563EB"/>
      <path d="M34 38L37 41L44 34" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Header Titles -->
    <text x="280" y="155" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="900" fill="#0F172A">
      Two-Factor Cryptographic 2FA
    </text>
    <text x="280" y="185" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#64748B">
      DISPATCHED TO AUTHENTICATED ADDRESS:
    </text>
    <text x="280" y="208" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#2563EB">
      alice.nguyen***@university.edu.vn
    </text>

    <!-- Amount Pill -->
    <g transform="translate(170, 228)">
      <rect width="220" height="34" rx="8" fill="#0F172A"/>
      <text x="110" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#38BDF8">
        SETTLE DEMAND: ₫ 8,400,000
      </text>
    </g>

    <!-- 6 INDIVIDUAL CYPHER PIN CELLS (Glowing Focus Cell) -->
    <g transform="translate(50, 290)">
      <!-- Cell 1 -->
      <rect width="68" height="76" rx="14" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
      <text x="34" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="900" fill="#0F172A">8</text>

      <!-- Cell 2 -->
      <g transform="translate(80, 0)">
        <rect width="68" height="76" rx="14" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
        <text x="34" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="900" fill="#0F172A">4</text>
      </g>

      <!-- Cell 3 -->
      <g transform="translate(160, 0)">
        <rect width="68" height="76" rx="14" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
        <text x="34" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="900" fill="#0F172A">9</text>
      </g>

      <!-- Cell 4 -->
      <g transform="translate(240, 0)">
        <rect width="68" height="76" rx="14" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
        <text x="34" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="900" fill="#0F172A">2</text>
      </g>

      <!-- Cell 5 (Glowing Focus) -->
      <g transform="translate(320, 0)">
        <rect width="68" height="76" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
        <line x1="34" y1="20" x2="34" y2="56" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Cell 6 -->
      <g transform="translate(400, 0)">
        <rect width="68" height="76" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
        <circle cx="34" cy="38" r="5" fill="#94A3B8"/>
      </g>
    </g>

    <!-- Circular HUD Timer Ring -->
    <g transform="translate(130, 405)">
      <circle cx="22" cy="22" r="18" fill="none" stroke="#E2E8F0" stroke-width="3.5"/>
      <circle cx="22" cy="22" r="18" fill="none" stroke="#D97706" stroke-width="3.5" stroke-dasharray="113" stroke-dashoffset="38"/>
      <text x="56" y="20" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#B45309">
        CODE TIMEOUT: 02:45 REMAINING
      </text>
      <text x="56" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#64748B">
        DID NOT RECEIVE? <tspan font-weight="800" fill="#2563EB">RESEND DISPATCH (22s)</tspan>
      </text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(50, 495)">
      <!-- Cancel -->
      <rect width="140" height="54" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="48" y="33" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#64748B">Abort</text>

      <!-- Confirm -->
      <g transform="translate(155, 0)">
        <rect width="305" height="54" rx="14" fill="#2563EB"/>
        <text x="75" y="33" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">Confirm &amp; Settle Fee</text>
        <path d="M245 28L252 33L245 38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Security Guarantee Badge -->
    <g transform="translate(110, 590)">
      <circle cx="12" cy="12" r="10" fill="#ECFDF5"/>
      <path d="M9 12L11 14L15 10" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#047857">
        SESSION KEY: #AES-GCM-88401 · 100% NON-REPUDIABLE
      </text>
    </g>
  </g>
</svg>